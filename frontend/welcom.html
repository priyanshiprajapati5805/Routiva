
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to RideLoop</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="welcome-navbar">
        <a href="index.html" class="subscription-brand">
            <img src="images/Routiva Road Loop Logo.png" alt="Routiva Logo" class="logo">
        </a>
    </header>

    <main class="welcome-container">

        <div class="welcome-content">

            <div class="welcome-text">
                <p class="welcome-tagline">YOUR JOURNEY, OUR PRIORITY</p>

                <h1>
                    Travel Together,<br>
                    <span>Save Together.</span>
                </h1>

                <p class="welcome-description">
                    Find affordable rides, share your journey
                    and make everyday travel easier with Routiva.
                </p>

                <div class="welcome-buttons">
                    <a href="signup.html" class="welcome-signup">
                        Sign Up
                    </a>

                    <a href="login.html" class="welcome-login">
                        Login
                    </a>
                </div>

                <p class="welcome-footer-text">
                    Join Routiva and make your journey better.
                </p>
            </div>

            <div class="welcome-image">
                <img
                    src="images/home page.png"
                    alt="Routiva shared travel illustration">
            </div>

        </div>

    </main>

</body>
</html>
